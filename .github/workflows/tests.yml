name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
        with-graphify: [true]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            with-graphify: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Install graphify (integration tests)
        if: matrix.with-graphify
        run: pip install graphifyy
      - name: Test
        env:
          GRAPHIFY_BACKEND: none
          GRAPHIFY_QUERY_LOG_DISABLE: "1"
        run: pytest -q -rs
